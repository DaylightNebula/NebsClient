# JitPack build: https://jitpack.io/#DaylightNebula/NebsClient
# The mod needs Java 25, which JitPack's `jdk:` list doesn't offer, so install it with SDKMAN.
before_install:
  - sdk install java 25.0.4-tem
  - sdk use java 25.0.4-tem

# Publish under JitPack's coordinates (com.github.DaylightNebula.NebsClient:<module>:<tag>), so the
# POMs' dependencies between modules point at artifacts JitPack actually serves.
#
# The wrapper is started with -classpath instead of ./gradlew: since early October 2026, `java -jar`
# fails on JitPack's "latest" build image with "An unexpected error occurred while trying to open
# file" for any jar (https://github.com/jitpack/jitpack.io/issues/8096). Go back to ./gradlew once
# that's fixed.
install:
  - export JAVA_HOME="${SDKMAN_DIR:-$HOME/.sdkman}/candidates/java/25.0.4-tem"; export PATH="$JAVA_HOME/bin:$PATH"; echo "JAVA_HOME=$JAVA_HOME"; java -version; java -cp gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain publishToMavenLocal -x test -Pnebs.group=$GROUP.$ARTIFACT -Pversion=$VERSION
